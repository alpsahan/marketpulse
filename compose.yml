services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MARKETPULSE_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"


  app:
    build: .
    image: marketpulse-app:latest

    ports:
      - "8080:8080"

    environment:
      MARKETPULSE_DB_URL: jdbc:postgresql://postgres:5432/marketpulse
      MARKETPULSE_DB_USERNAME: postgres
      MARKETPULSE_DB_PASSWORD: ${MARKETPULSE_DB_PASSWORD}

      MARKETPULSE_REDIS_HOST: redis
      MARKETPULSE_REDIS_PORT: 6379

      MARKETPULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started


volumes:
  postgres-data: