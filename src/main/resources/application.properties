spring.application.name=marketpulse

# PostgreSQL
spring.datasource.url=${MARKETPULSE_DB_URL:jdbc:postgresql://localhost:5435/marketpulse}
spring.datasource.username=${MARKETPULSE_DB_USERNAME}
spring.datasource.password=${MARKETPULSE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Redis
spring.data.redis.host=${MARKETPULSE_REDIS_HOST:localhost}
spring.data.redis.port=${MARKETPULSE_REDIS_PORT:6379}


# Kafka
spring.kafka.bootstrap-servers=${MARKETPULSE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=marketpulse-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.alpsahan.event


# JWT
jwt.secret=${JWT_SECRET}


# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000




spring.jackson.deserialization.fail-on-unknown-properties=true











