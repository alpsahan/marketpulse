services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1


  backend:
    image: ${ECR_REGISTRY}/marketpulse-backend:${IMAGE_TAG}
    restart: unless-stopped

    environment:
      MARKETPULSE_DB_URL: ${MARKETPULSE_DB_URL}
      MARKETPULSE_DB_USERNAME: ${MARKETPULSE_DB_USERNAME}
      MARKETPULSE_DB_PASSWORD: ${MARKETPULSE_DB_PASSWORD}

      MARKETPULSE_REDIS_HOST: redis
      MARKETPULSE_REDIS_PORT: 6379

      MARKETPULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}

    expose:
      - "8080"

    depends_on:
      redis:
        condition: service_healthy

      kafka:
        condition: service_started


  frontend:
    image: ${ECR_REGISTRY}/marketpulse-frontend:${IMAGE_TAG}
    restart: unless-stopped

    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      backend:
        condition: service_started