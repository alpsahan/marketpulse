name: MarketPulse CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      MARKETPULSE_DB_USERNAME: postgres
      MARKETPULSE_DB_PASSWORD: postgres
      JWT_SECRET: 0123456789012345678901234567890123456789012345678901234567890123
      MAIL_USERNAME: test@example.com
      MAIL_APP_PASSWORD: test-password

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: ./mvnw -B test


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build


  deploy:
    name: Deploy to AWS

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - backend
      - frontend

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-central-1
      ECR_REGISTRY: 659681154227.dkr.ecr.eu-central-1.amazonaws.com
      EC2_INSTANCE_ID: i-047dd85033f23c967

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::659681154227:role/MarketPulseGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/marketpulse-backend:${GITHUB_SHA}" \
            .

          docker push \
            "${ECR_REGISTRY}/marketpulse-backend:${GITHUB_SHA}"

      - name: Build and push frontend image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/marketpulse-frontend:${GITHUB_SHA}" \
            ./frontend

          docker push \
            "${ECR_REGISTRY}/marketpulse-frontend:${GITHUB_SHA}"

      - name: Deploy to EC2 with SSM
        run: |
          cat > ssm-params.json <<EOF
          {
            "commands": [
              "runuser -u ubuntu -- git -C /home/ubuntu/marketpulse fetch origin main",
              "runuser -u ubuntu -- git -C /home/ubuntu/marketpulse checkout -B main origin/main",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "cd /home/ubuntu/marketpulse && ECR_REGISTRY=${ECR_REGISTRY} IMAGE_TAG=${GITHUB_SHA} docker compose -f compose.prod.yml pull",
              "cd /home/ubuntu/marketpulse && ECR_REGISTRY=${ECR_REGISTRY} IMAGE_TAG=${GITHUB_SHA} docker compose -f compose.prod.yml up -d --remove-orphans",
              "healthy=0; i=1; while [ \$i -le 30 ]; do if curl -fsS --resolve marketpulse-alp.duckdns.org:443:127.0.0.1 https://marketpulse-alp.duckdns.org/actuator/health | grep -q 'UP'; then echo 'MarketPulse HTTPS is healthy'; healthy=1; break; fi; echo 'Waiting for MarketPulse HTTPS...'; sleep 2; i=\$((i+1)); done; if [ \$healthy -ne 1 ]; then echo 'HTTPS health check failed'; exit 1; fi",
              "docker image prune -f"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MarketPulse ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          STATUS="Pending"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status: ${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              break
            fi

            if [ "${STATUS}" = "Failed" ] || \
               [ "${STATUS}" = "Cancelled" ] || \
               [ "${STATUS}" = "TimedOut" ]; then
              echo "SSM deployment failed with status: ${STATUS}"
              exit 1
            fi

            sleep 5
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "SSM deployment did not finish within 5 minutes"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'

      - name: Verify public HTTPS endpoint
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://marketpulse-alp.duckdns.org/actuator/health | grep -q 'UP'; then
              echo "Public HTTPS endpoint is healthy"
              exit 0
            fi

            echo "Waiting for public HTTPS endpoint..."
            sleep 5
          done

          echo "Public HTTPS verification failed"
          exit 1